name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv
      - run: uv sync --extra dev --extra web --group dev
      - run: uv run pytest -q -m "not model_smoke"
        env:
          HIPPO_EMBEDDING_PROVIDER: disabled

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv
      - run: uv build --wheel
      - run: python scripts/verify-wheel.py dist/*.whl
